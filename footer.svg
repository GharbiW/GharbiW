0" dur="2.4s" repeatCount="indefinite"/></path><path d="M0 210H1000" stroke="#5C26FF" stroke-opacity="0.14"><animate attributeName="d" values="M0 210H1000;M0 192H1000" dur="2.4s" repeatCount="indefinite"/></path>
