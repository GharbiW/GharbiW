<svg xmlns="http://www.w3.org/2000/svg" width="490" height="250" viewBox="0 0 490 250" fill="none">
<defs><linearGradient id="sh" x1="0" y1="0" x2="490" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5C26FF" stop-opacity="0"/><stop offset=".5" stop-color="#5C26FF" stop-opacity=".9"/><stop offset="1" stop-color="#5C26FF" stop-opacity="0"/>
<animate attributeName="x1" values="-490;490" dur="5s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="x2" values="0;980" dur="5s" begin="0.0s" repeatCount="indefinite"/></linearGradient></defs>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif} .mono{font-family:&quot;JetBrains Mono&quot;,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
