<svg xmlns="http://www.w3.org/2000/svg" width="320" height="210" viewBox="0 0 320 210" fill="none">
<defs><linearGradient id="sh" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5C26FF" stop-opacity="0"/><stop offset=".5" stop-color="#5C26FF" stop-opacity=".9"/><stop offset="1" stop-color="#5C26FF" stop-opacity="0"/>
<animate attributeName="x1" values="-320;320" dur="5s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="x2" values="0;640" dur="5s" begin="0.0s" repeatCount="indefinite"/></linearGradient></defs>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif} .mono{font-family:&quot;JetBrains Mono&quot;,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:6;opacity:.8}100%{r:22;opacity:0}}
.up{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}</style><g class="up" style="animation-delay:0.00s"><rect x=".5" y=".5" width="319" height="209" rx="18" fill="#FAFAFC" stroke="#E6E6EE"/><rect x=".5" y=".5" width="319" height="209" rx="18" stroke="url(#sh)" stroke-width="1.5"/><rect x="28.0" y="24" width="67.6" height="24" rx="12" fill="#F1EEFF" stroke="#E6E6EE"/><text x="39.0" y="40" class="mono" font-size="11" letter-spacing="1" fill="#5A5A68">THESIS</text><text x="28" y="106" font-size="21" font-weight="700" letter-spacing="-.3" fill="#0A0A0A">Value of internal data</text><text x="28" y="134" font-size="14" fill="#5A5A68">Why the data companies already own</text><text x="28" y="155" font-size="14" fill="#5A5A68">matters when AI runs short of</text><text x="28" y="176" font-size="14" fill="#5A5A68">quality training data.</text></g></svg>